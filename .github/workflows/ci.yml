name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      # the optional Rust accelerator: build it, run the suite with it and without it (FLUXCODE_RUST=0)
      - run: uv run --with maturin maturin develop --release --manifest-path rust/Cargo.toml
      - run: uv run pytest
      - run: FLUXCODE_RUST=0 uv run pytest
      - run: uv run ruff check
      # experimental/ is excluded from the lint config: still check it for syntax errors and undefined names
      - run: uv run ruff check --isolated --select E9,F63,F7,F82 experimental
      # ...and run the parts that reach into fluxcode's private modules
      - run: uv run --locked --project experimental python experimental/smoke.py
      - run: uv run mypy fluxcode
      - run: uv run ty check
