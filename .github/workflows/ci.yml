name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      # the optional Rust accelerator (the rust extra, built from rust/): run the suite with it, which must
      # include its tests (a plain `uv run` would sync it away again), and with it switched off
      - run: uv run --locked --extra rust pytest -rs --junitxml=rust.xml
      - run: python3 -c "import sys, xml.etree.ElementTree as t; r = t.parse('rust.xml').getroot().iter('testcase'); sys.exit(sum(1 for c in r if 'test_rust' in c.get('classname', '') and c.find('skipped') is not None))"
      - run: FLUXCODE_RUST=0 uv run --locked --extra rust pytest
      - run: uv run ruff check
      # experimental/ is excluded from the lint config: still check it for syntax errors and undefined names
      - run: uv run ruff check --isolated --select E9,F63,F7,F82 experimental
      # ...and run the parts that reach into fluxcode's private modules
      - run: uv run --locked --project experimental python experimental/smoke.py
      - run: uv run mypy fluxcode
      - run: uv run ty check
