[package]
name = "fluxcode_rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "fluxcode_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
zstd-safe = { version = "7", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
